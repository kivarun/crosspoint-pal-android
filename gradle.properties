# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX is required for all androidx libraries.
android.useAndroidX=true
# Generate R classes that only contain resources declared in the own module.
android.nonTransitiveRClass=true
# Official Kotlin code style for the repository.
kotlin.code.style=official
